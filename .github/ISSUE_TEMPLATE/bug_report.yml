name: Bug report
description: Report a reproducible problem in FutureOS
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include decision records, credentials, private analytics, or other sensitive data."
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: "1. Open …\n2. Select …\n3. Observe …"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: "Safari 19 on macOS"
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or logs
      description: Remove personal data before attaching anything.
